<!doctype html>
<!--
  Design-tuner dashboard (docs/tuner/TODO.md, 8.4) — served by the Metro
  middleware at /__tuner/. One file, no build step: edit and refresh.
  Polls /__tuner/ui/state every 500ms (POC transport decision — see plan).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Design tuner</title>
<style>
  :root {
    --accent: #00E0B8;
    --bg: #0e0f11;
    --panel: #131417;
    --hairline: rgba(255, 255, 255, 0.09);
    --hot: #ffffff;
    --mid: rgba(255, 255, 255, 0.72);
    --dim: rgba(255, 255, 255, 0.40);
    --mono: "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--mid);
    font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  header h1 { font-size: 13px; font-weight: 600; color: var(--hot); }
  #modeBtn {
    border: 0;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    padding: 7px 14px;
    cursor: pointer;
    background: var(--accent);
    color: #00312A;
  }
  #modeBtn.on {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--mid);
  }
  #status {
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dim);
  }
  #status.live { color: var(--mid); }
  #status.live::before { background: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }
  #layers {
    width: 340px;
    border-right: 1px solid var(--hairline);
    overflow-y: auto;
    padding: 8px 0;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 16px 5px 0;
    border-left: 2px solid transparent;
    cursor: default;
    white-space: nowrap;
  }
  .row:hover { background: rgba(255, 255, 255, 0.04); }
  .row.selected {
    border-left-color: var(--accent);
    background: rgba(0, 224, 184, 0.08);
  }
  .row .name { color: var(--hot); font-size: 12px; }
  .row.selected .name { color: var(--accent); }
  .row .loc {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
  }
  #empty {
    padding: 24px 16px;
    color: var(--dim);
    font-size: 12px;
    display: none;
  }
  #inspector {
    flex: 1;
    padding: 20px 24px;
    color: var(--dim);
    font-size: 12px;
    overflow-y: auto;
    max-width: 460px;
  }
  #inspector h2 { font-size: 14px; color: var(--hot); font-weight: 600; }
  #inspector .subloc {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    margin: 3px 0 18px;
  }
  .ctl { margin-bottom: 14px; }
  .ctl .top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .ctl label { color: var(--mid); font-size: 12px; }
  .ctl .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--hot);
  }
  .ctl input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .swatch {
    width: 22px; height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
    padding: 0;
  }
  .hex {
    width: 110px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    color: var(--hot);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
  }
  #saveBtn {
    margin-top: 10px;
    background: var(--accent);
    color: #00312A;
    border: 0;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    padding: 8px 18px;
    cursor: pointer;
  }
  #saveBtn:active { opacity: 0.8; }
  .hint { margin-top: 10px; font-size: 11px; color: var(--dim); }
  .row { cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h1>Design tuner</h1>
    <button id="modeBtn">Enter design mode</button>
    <span id="status">waiting for app</span>
  </header>
  <main>
    <div id="layers"></div>
    <div id="empty">Design mode is off — click "Enter design mode" above.</div>
    <div id="inspector">Select an element — tap on the phone, or click a layer row.</div>
  </main>

<script>
  const layersEl = document.getElementById('layers');
  const emptyEl = document.getElementById('empty');
  const statusEl = document.getElementById('status');
  const inspectorEl = document.getElementById('inspector');
  const modeBtn = document.getElementById('modeBtn');

  let designOpen = false;
  modeBtn.addEventListener('click', () => {
    fetch('/__tuner/ui/mode', {
      method: 'POST',
      body: JSON.stringify({ on: !designOpen }),
    }).catch(() => {});
  });

  const NUMERIC = [
    { key: 'borderRadius', label: 'Radius', min: 0, max: 48, step: 1, fallback: 0 },
    { key: 'padding', label: 'Padding', min: 0, max: 48, step: 1, fallback: 0 },
    { key: 'margin', label: 'Margin', min: 0, max: 48, step: 1, fallback: 0 },
    { key: 'opacity', label: 'Opacity', min: 0, max: 1, step: 0.05, fallback: 1 },
  ];
  const SWATCHES = ['#FF3B30','#FF9500','#FFCC00','#34C759','#00C7BE','#0A84FF',
                    '#5856D6','#AF52DE','#FFFFFF','#8E8E93','#3C3C43','#000000'];

  // Live edits: merge into one patch, flush at most every 80ms (8.7).
  let pendingPatch = null, patchTimer = null, patchLoc = null;
  function sendOverride(loc, key, value) {
    if (patchLoc !== loc) { pendingPatch = null; patchLoc = loc; }
    pendingPatch = Object.assign(pendingPatch || {}, { [key]: value });
    if (patchTimer) return;
    patchTimer = setTimeout(() => {
      const body = JSON.stringify({ loc: patchLoc, patch: pendingPatch });
      pendingPatch = null; patchTimer = null;
      fetch('/__tuner/ui/override', { method: 'POST', body }).catch(() => {});
    }, 80);
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /** "RCTText" → "Text"; loc tail "Playground.tsx:22:6". */
  const displayName = (name) => esc(name.replace(/^RCT/, ''));
  const locTail = (loc) => esc(loc.split('/').pop());

  function renderTree(nodes, selection, depth, out) {
    for (const node of nodes) {
      const selected = node.loc === selection ? ' selected' : '';
      out.push(
        `<div class="row${selected}" data-loc="${esc(node.loc)}"` +
        ` style="padding-left:${14 + depth * 16}px">` +
        `<span class="name">${displayName(node.name)}</span>` +
        `<span class="loc">${locTail(node.loc)}</span></div>`
      );
      renderTree(node.children, selection, depth + 1, out);
    }
  }

  // Click a layer row → select on the phone (8.6).
  layersEl.addEventListener('click', (event) => {
    const row = event.target.closest('.row');
    if (!row) return;
    fetch('/__tuner/ui/select', {
      method: 'POST',
      body: JSON.stringify({ loc: row.dataset.loc }),
    }).catch(() => {});
  });

  // Inspector (8.7): rebuilt only when the SELECTION changes, never on poll —
  // a rebuild mid-drag would yank the slider out of the user's hand.
  let renderedSelection = null;
  function renderInspector(loc, meta) {
    renderedSelection = loc;
    if (!loc) {
      inspectorEl.innerHTML = 'Select an element — tap on the phone, or click a layer row.';
      return;
    }
    const style = (meta && meta.style) || {};
    const name = (meta && meta.name) || 'element';
    const isText = /Text/.test(name);

    let html = `<h2>${displayName(name)}</h2><div class="subloc">${esc(loc)}</div>`;
    for (const c of NUMERIC) {
      const value = typeof style[c.key] === 'number' ? style[c.key] : c.fallback;
      html += `<div class="ctl"><div class="top"><label>${c.label}</label>` +
        `<span class="num" id="num-${c.key}">${value}</span></div>` +
        `<input type="range" data-key="${c.key}" min="${c.min}" max="${c.max}"` +
        ` step="${c.step}" value="${value}"></div>`;
    }
    const colorTargets = isText
      ? [['backgroundColor', 'Background'], ['color', 'Text colour']]
      : [['backgroundColor', 'Background']];
    for (const [key, label] of colorTargets) {
      const current = typeof style[key] === 'string' ? style[key] : '';
      html += `<div class="ctl"><div class="top"><label>${label}</label>` +
        `<span class="num">${esc(current || '—')}</span></div><div class="swatches">` +
        SWATCHES.map((c) =>
          `<button class="swatch" data-key="${key}" data-color="${c}" style="background:${c}"></button>`,
        ).join('') +
        `</div><input class="hex" data-key="${key}" placeholder="#RRGGBB" value="${esc(current)}"></div>`;
    }
    html += `<button id="saveBtn">Save to source</button>` +
      `<div class="hint">Save writes the file — check git diff after.</div>`;
    inspectorEl.innerHTML = html;

    inspectorEl.querySelectorAll('input[type="range"]').forEach((input) => {
      input.addEventListener('input', () => {
        const value = parseFloat(input.value);
        document.getElementById('num-' + input.dataset.key).textContent = value;
        sendOverride(loc, input.dataset.key, value);
      });
    });
    inspectorEl.querySelectorAll('.swatch').forEach((button) => {
      button.addEventListener('click', () =>
        sendOverride(loc, button.dataset.key, button.dataset.color));
    });
    inspectorEl.querySelectorAll('.hex').forEach((input) => {
      input.addEventListener('change', () => {
        if (/^#[0-9a-fA-F]{3,8}$/.test(input.value.trim()))
          sendOverride(loc, input.dataset.key, input.value.trim());
      });
    });
    document.getElementById('saveBtn').addEventListener('click', () => {
      fetch('/__tuner/ui/save', { method: 'POST', body: JSON.stringify({ loc }) }).catch(() => {});
    });
  }

  let lastPayload = '';

  async function poll() {
    try {
      const state = await (await fetch('/__tuner/ui/state')).json();
      const hasTree = Array.isArray(state.tree) && state.tree.length > 0;
      const fresh = hasTree && Date.now() - state.treeAt < 6000;

      statusEl.textContent = fresh ? 'app live' : 'waiting for app';
      statusEl.classList.toggle('live', fresh);

      designOpen = state.designOpen === true;
      modeBtn.textContent = designOpen ? 'Exit design mode' : 'Enter design mode';
      modeBtn.classList.toggle('on', designOpen);

      // Re-render only when something changed — keeps scroll position stable.
      const payload = JSON.stringify([state.tree, state.selection]);
      if (payload !== lastPayload) {
        lastPayload = payload;
        if (hasTree) {
          const out = [];
          renderTree(state.tree, state.selection, 0, out);
          layersEl.innerHTML = out.join('');
          const selected = layersEl.querySelector('.row.selected');
          if (selected) selected.scrollIntoView({ block: 'nearest' });
        } else {
          layersEl.innerHTML = '';
        }
        emptyEl.style.display = hasTree ? 'none' : 'block';
        layersEl.style.display = hasTree ? 'block' : 'none';
      }
      if (state.selection !== renderedSelection) {
        renderInspector(state.selection, state.selectionMeta);
      }
    } catch {
      statusEl.textContent = 'dev server unreachable';
      statusEl.classList.remove('live');
    }
    setTimeout(poll, 500);
  }
  poll();
</script>
</body>
</html>
