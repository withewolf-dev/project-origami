<!doctype html>
<!--
  Design-tuner dashboard (docs/tuner/TODO.md, 8.4 + 10.x) — served by the
  Metro middleware at /__tuner/ with Cache-Control: no-store. One file, no
  build step: edit and refresh.

  Inspector model (v2): NO sliders. Every numeric value is a compact
  label+field row — drag horizontally on the LABEL to scrub (Figma's
  gesture), type in the field for exact values, arrow keys nudge. Per-side /
  per-corner longhands are ONE four-up row behind a corner toggle. Properties
  group into sections (Layout / Spacing / Radius / ...) driven by the shared
  key tables.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Design tuner</title>
<style>
  :root {
    --accent: #00E0B8;
    --bg: #0e0f11;
    --hairline: rgba(255, 255, 255, 0.09);
    --hot: #ffffff;
    --mid: rgba(255, 255, 255, 0.72);
    --dim: rgba(255, 255, 255, 0.40);
    --field: rgba(255, 255, 255, 0.07);
    --mono: "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--mid);
    font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  header h1 { font-size: 13px; font-weight: 600; color: var(--hot); }
  #modeBtn {
    border: 0;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    padding: 7px 14px;
    cursor: pointer;
    background: var(--accent);
    color: #00312A;
  }
  #modeBtn.on {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--mid);
  }
  #status {
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--dim);
  }
  #status.live { color: var(--mid); }
  #status.live::before { background: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }
  #layers {
    width: 320px;
    border-right: 1px solid var(--hairline);
    overflow-y: auto;
    padding: 8px 0;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 16px 5px 0;
    border-left: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }
  .row:hover { background: rgba(255, 255, 255, 0.04); }
  .row.selected {
    border-left-color: var(--accent);
    background: rgba(0, 224, 184, 0.08);
  }
  .row .name { color: var(--hot); font-size: 12px; }
  .row.selected .name { color: var(--accent); }
  .row .loc {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
  }
  #empty { padding: 24px 16px; color: var(--dim); font-size: 12px; display: none; }

  #inspector {
    flex: 1;
    padding: 18px 22px 28px;
    overflow-y: auto;
    max-width: 420px;
    font-size: 12px;
  }
  #inspector h2 { font-size: 14px; color: var(--hot); font-weight: 600; }
  #inspector .subloc {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    margin-top: 3px;
  }
  h3.sec {
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
    border-top: 1px solid var(--hairline);
    margin-top: 16px;
    padding-top: 12px;
    margin-bottom: 10px;
  }
  .prop {
    display: grid;
    grid-template-columns: 84px 1fr;
    align-items: center;
    margin-bottom: 8px;
    min-height: 24px;
  }
  .prop > label {
    font-size: 11px;
    color: var(--mid);
    user-select: none;
  }
  .prop > label.scrub { cursor: ew-resize; }
  .prop > label.scrub:hover { color: var(--accent); }
  .val { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  .numIn {
    width: 60px;
    background: var(--field);
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--hot);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 7px;
    text-align: right;
  }
  .numIn:focus { outline: none; border-color: var(--accent); }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .fourBtn {
    width: 24px; height: 24px;
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    color: var(--dim);
    font-size: 11px;
    cursor: pointer;
    line-height: 1;
  }
  .fourBtn.on { color: var(--accent); border-color: var(--accent); }
  .four {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 2px 0 4px;
  }
  .four .cell span {
    display: block;
    font-size: 9px;
    color: var(--dim);
    text-align: center;
    margin-bottom: 2px;
    user-select: none;
    cursor: ew-resize;
  }
  .four .cell input { width: 100%; text-align: center; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .segBtn {
    background: var(--field);
    border: 0;
    border-radius: 6px;
    color: var(--mid);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    cursor: pointer;
  }
  .segBtn.sel { background: var(--accent); color: #00312A; }
  .chip {
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
    padding: 0;
    flex: none;
  }
  .hexIn {
    width: 84px;
    background: var(--field);
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--hot);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 7px;
  }
  .hexIn:focus { outline: none; border-color: var(--accent); }
  .picker {
    grid-column: 1 / -1;
    display: none;
    padding: 10px 0 6px;
  }
  .picker.open { display: block; }
  .sv {
    position: relative;
    height: 140px;
    border-radius: 8px;
    cursor: crosshair;
    touch-action: none;
  }
  .sv .dot {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    transform: translate(-6px, -6px);
    pointer-events: none;
  }
  .strip {
    position: relative;
    height: 12px;
    border-radius: 6px;
    margin-top: 10px;
    cursor: ew-resize;
    touch-action: none;
  }
  .strip.hue {
    background: linear-gradient(to right,
      #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .strip .handle {
    position: absolute;
    top: -2px;
    width: 8px; height: 16px;
    border-radius: 4px;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    transform: translateX(-4px);
    pointer-events: none;
  }
  .swRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .swatch {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
    padding: 0;
  }
  .actions { margin-top: 20px; display: flex; gap: 8px; align-items: center; }
  #saveBtn {
    background: var(--accent);
    color: #00312A;
    border: 0;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    padding: 8px 18px;
    cursor: pointer;
  }
  #saveBtn:active { opacity: 0.8; }
  .quiet {
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    color: var(--mid);
    font-size: 12px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .hint { margin-top: 8px; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
  <header>
    <h1>Design tuner</h1>
    <button id="modeBtn">Enter design mode</button>
    <span id="status">waiting for app</span>
  </header>
  <main>
    <div id="layers"></div>
    <div id="empty">Design mode is off — click "Enter design mode" above.</div>
    <div id="inspector">Select an element — tap on the phone, or click a layer row.</div>
  </main>

<script>
  const layersEl = document.getElementById('layers');
  const emptyEl = document.getElementById('empty');
  const statusEl = document.getElementById('status');
  const inspectorEl = document.getElementById('inspector');
  const modeBtn = document.getElementById('modeBtn');

  // Key tables come from the server (10.1) — ONE definition shared with the
  // phone panel; the dashboard never hardcodes what is tunable.
  let KEYS = { NUMERIC_KEYS: [], ENUM_KEYS: [], COLOR_KEYS: [], SIZE_KEYS: [] };
  fetch('/__tuner/ui/keys').then((r) => r.json()).then((k) => { KEYS = k; });

  const SECTIONS = [
    ['layout', 'Layout'], ['spacing', 'Spacing'], ['radius', 'Radius'],
    ['border', 'Border'], ['typography', 'Typography'], ['fill', 'Fill'],
    ['effects', 'Effects'], ['size', 'Size'],
  ];
  const SWATCHES = ['#FF3B30','#FF9500','#FFCC00','#34C759','#00C7BE','#0A84FF',
                    '#5856D6','#AF52DE','#FFFFFF','#8E8E93','#3C3C43','#000000'];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const displayName = (name) => esc(name.replace(/^RCT/, ''));
  const locTail = (loc) => esc(loc.split('/').pop());

  let designOpen = false;
  modeBtn.addEventListener('click', () => {
    fetch('/__tuner/ui/mode', { method: 'POST', body: JSON.stringify({ on: !designOpen }) })
      .catch(() => {});
  });

  // Live edits: merge into one patch, flush at most every 80ms (8.7).
  let pendingPatch = null, patchTimer = null, patchLoc = null;
  function sendOverride(loc, key, value) {
    if (patchLoc !== loc) { pendingPatch = null; patchLoc = loc; }
    pendingPatch = Object.assign(pendingPatch || {}, { [key]: value });
    if (patchTimer) return;
    patchTimer = setTimeout(() => {
      const body = JSON.stringify({ loc: patchLoc, patch: pendingPatch });
      pendingPatch = null; patchTimer = null;
      fetch('/__tuner/ui/override', { method: 'POST', body }).catch(() => {});
    }, 80);
  }

  function postUndo() {
    fetch('/__tuner/ui/undo', { method: 'POST' }).catch(() => {});
  }
  document.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'z') {
      event.preventDefault();
      postUndo();
    }
  });

  layersEl.addEventListener('click', (event) => {
    const row = event.target.closest('.row');
    if (!row) return;
    fetch('/__tuner/ui/select', { method: 'POST', body: JSON.stringify({ loc: row.dataset.loc }) })
      .catch(() => {});
  });

  /**
   * Figma's gesture: drag horizontally on a label to scrub the paired field.
   * 1px = 1 step; Shift = 10×. Typing and arrow keys live on the field.
   */
  function attachScrub(labelEl, inputEl, spec, apply) {
    labelEl.classList.add('scrub');
    labelEl.addEventListener('pointerdown', (down) => {
      down.preventDefault();
      labelEl.setPointerCapture(down.pointerId);
      const startX = down.clientX;
      const startValue = parseFloat(inputEl.value) || 0;
      const move = (ev) => {
        const mult = ev.shiftKey ? 10 : 1;
        const raw = startValue + (ev.clientX - startX) * spec.step * mult;
        const stepped = Math.round(raw / spec.step) * spec.step;
        const next = Number(Math.min(spec.max, Math.max(spec.min, stepped)).toFixed(2));
        if (String(next) !== inputEl.value) {
          inputEl.value = next;
          apply(next);
        }
      };
      const up = () => {
        labelEl.removeEventListener('pointermove', move);
        labelEl.removeEventListener('pointerup', up);
      };
      labelEl.addEventListener('pointermove', move);
      labelEl.addEventListener('pointerup', up);
    });
  }

  function numericValue(style, key, fallback) {
    return typeof style[key] === 'number' ? style[key] : fallback;
  }

  // ---- colour maths (Figma-style picker) ----
  function hexToRgb(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    if (h.length !== 6 && h.length !== 8) return null;
    return {
      r: parseInt(h.slice(0, 2), 16),
      g: parseInt(h.slice(2, 4), 16),
      b: parseInt(h.slice(4, 6), 16),
    };
  }
  function rgbToHsv({ r, g, b }) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h, s: max === 0 ? 0 : d / max, v: max };
  }
  function hsvToHex({ h, s, v }) {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    let r = 0, g = 0, b = 0;
    if (h < 60) [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];
    const to2 = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
    return `#${to2(r)}${to2(g)}${to2(b)}`.toUpperCase();
  }

  /** Horizontal/2D drag on a picker surface → cb(ratioX, ratioY), clamped. */
  function attachDrag(el, cb) {
    el.addEventListener('pointerdown', (down) => {
      down.preventDefault();
      el.setPointerCapture(down.pointerId);
      const apply = (ev) => {
        const rect = el.getBoundingClientRect();
        cb(
          Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width)),
          Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height)),
        );
      };
      apply(down);
      const move = (ev) => apply(ev);
      const up = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  }

  /**
   * The full Figma-style picker behind a colour chip: SV gradient square +
   * hue strip + swatches + hex field, all bidirectionally synced.
   */
  function setupPicker(loc, key) {
    const chip = inspectorEl.querySelector(`.chip[data-pop="${key}"]`);
    const hexIn = inspectorEl.querySelector(`.hexIn[data-key="${key}"]`);
    const pop = document.getElementById('pop-' + key);
    const sv = pop.querySelector('.sv');
    const dot = pop.querySelector('.dot');
    const hue = pop.querySelector('.strip.hue');
    const hueHandle = hue.querySelector('.handle');

    const state = { h: 0, s: 0, v: 1 };

    function paint() {
      const hueOnly = hsvToHex({ h: state.h, s: 1, v: 1 });
      sv.style.background =
        `linear-gradient(to top, #000, rgba(0,0,0,0)), ` +
        `linear-gradient(to right, #fff, rgba(255,255,255,0)), ${hueOnly}`;
      dot.style.left = `${state.s * 100}%`;
      dot.style.top = `${(1 - state.v) * 100}%`;
      hueHandle.style.left = `${(state.h / 360) * 100}%`;
    }

    function seed(hex) {
      const rgb = hexToRgb(hex || '');
      if (rgb) Object.assign(state, rgbToHsv(rgb));
      paint();
    }

    function commit() {
      const hex = hsvToHex(state);
      hexIn.value = hex;
      chip.style.background = hex;
      paint();
      sendOverride(loc, key, hex);
    }

    chip.addEventListener('click', () => {
      seed(hexIn.value.trim());
      pop.classList.toggle('open');
    });
    attachDrag(sv, (x, y) => {
      state.s = x;
      state.v = 1 - y;
      commit();
    });
    attachDrag(hue, (x) => {
      state.h = x * 360;
      commit();
    });
    pop.querySelectorAll('.swatch').forEach((button) => {
      button.addEventListener('click', () => {
        seed(button.dataset.color);
        commit();
      });
    });
    hexIn.addEventListener('change', () => {
      const value = hexIn.value.trim();
      if (!/^#[0-9a-fA-F]{3,8}$/.test(value)) return;
      seed(value);
      chip.style.background = value;
      sendOverride(loc, key, value);
    });
    seed(hexIn.value.trim());
  }

  let renderedSelection = null;

  function renderInspector(loc, meta) {
    renderedSelection = loc;
    if (!loc) {
      inspectorEl.innerHTML = 'Select an element — tap on the phone, or click a layer row.';
      return;
    }
    const style = (meta && meta.style) || {};
    const name = (meta && meta.name) || 'element';
    const kind = /Text/.test(name) ? 'text' : 'view';
    const fits = (e) => e.appliesTo === 'any' || e.appliesTo === kind;

    const numeric = KEYS.NUMERIC_KEYS.filter(fits).concat(
      KEYS.SIZE_KEYS.filter((e) => typeof style[e.key] === 'number'));
    const enums = KEYS.ENUM_KEYS.filter(fits);
    const colors = KEYS.COLOR_KEYS.filter(fits);

    let html = `<h2>${displayName(name)}</h2><div class="subloc">${esc(loc)}</div>`;

    for (const [sectionId, sectionTitle] of SECTIONS) {
      const nums = numeric.filter((e) => e.section === sectionId);
      const segs = enums.filter((e) => e.section === sectionId);
      const cols = colors.filter((e) => e.section === sectionId);
      if (nums.length + segs.length + cols.length === 0) continue;

      html += `<h3 class="sec">${sectionTitle}</h3>`;

      for (const c of nums) {
        const value = numericValue(style, c.key, c.fallback);
        html += `<div class="prop"><label data-scrub="${c.key}">${c.label}</label>` +
          `<div class="val">` +
          (c.children
            ? `<button class="fourBtn" data-four="${c.key}" title="${c.childrenLabel}">⿲</button>`
            : '') +
          `<input type="number" class="numIn" data-key="${c.key}" data-spec="${c.key}"` +
          ` min="${c.min}" max="${c.max}" step="${c.step}" value="${value}"></div>`;
        if (c.children) {
          html += `<div class="four" id="four-${c.key}" style="display:none">` +
            c.children.map((child) => {
              const childValue = numericValue(style, child.key, value);
              const initials = child.label.split(' ').map((w) => w[0].toUpperCase()).join('');
              return `<div class="cell"><span data-scrub="${child.key}" title="${child.label}">${initials}</span>` +
                `<input type="number" class="numIn" data-key="${child.key}" data-spec="${c.key}"` +
                ` min="${c.min}" max="${c.max}" step="${c.step}" value="${childValue}"></div>`;
            }).join('') + `</div>`;
        }
        html += `</div>`;
      }

      for (const e of segs) {
        const current = style[e.key] != null ? String(style[e.key]) : '';
        html += `<div class="prop"><label>${e.label}</label><div class="seg">` +
          e.options.map((o) =>
            `<button class="segBtn${o === current ? ' sel' : ''}" data-key="${e.key}"` +
            ` data-value="${o}">${esc(o.replace('flex-', '').replace('space-', ''))}</button>`,
          ).join('') + `</div></div>`;
      }

      for (const c of cols) {
        const current = typeof style[c.key] === 'string' ? style[c.key] : '';
        html += `<div class="prop"><label>${c.label}</label><div class="val">` +
          `<button class="chip" data-pop="${c.key}" style="background:${esc(current) || 'transparent'}"></button>` +
          `<input class="hexIn" data-key="${c.key}" placeholder="—" value="${esc(current)}"></div>` +
          `<div class="picker" id="pop-${c.key}">` +
          `<div class="sv"><div class="dot"></div></div>` +
          `<div class="strip hue"><div class="handle"></div></div>` +
          `<div class="swRow">` +
          SWATCHES.map((s) =>
            `<button class="swatch" data-key="${c.key}" data-color="${s}" style="background:${s}"></button>`,
          ).join('') + `</div></div></div>`;
      }
    }

    html += `<div class="actions"><button id="saveBtn">Save to source</button>` +
      `<button id="undoBtn" class="quiet">Undo (⌘Z)</button></div>` +
      `<div class="hint">Drag a label to scrub · type for exact · Save writes the file.</div>`;
    inspectorEl.innerHTML = html;

    const specs = {};
    for (const c of numeric) specs[c.key] = c;

    // A stroke with no colour is invisible (RN defaults borderColor to
    // black): the first border-width edit on an element without a border
    // colour also sets a visible one — Figma's add-a-stroke behaviour.
    let borderColorSet = typeof style.borderColor === 'string';
    const ensureBorderColor = (key) => {
      if (borderColorSet || !/^border.*Width$/.test(key)) return;
      borderColorSet = true;
      const hex = inspectorEl.querySelector('.hexIn[data-key="borderColor"]');
      const chip = inspectorEl.querySelector('.chip[data-pop="borderColor"]');
      if (hex) hex.value = '#8E8E93';
      if (chip) chip.style.background = '#8E8E93';
      sendOverride(loc, 'borderColor', '#8E8E93');
    };

    inspectorEl.querySelectorAll('.numIn').forEach((input) => {
      input.addEventListener('input', () => {
        let value = parseFloat(input.value);
        if (Number.isNaN(value)) return;
        // Typed values must honour the range too — arrows already do.
        const spec = specs[input.dataset.spec];
        if (spec) value = Math.min(spec.max, Math.max(spec.min, value));
        input.dataset.last = String(value);
        ensureBorderColor(input.dataset.key);
        sendOverride(loc, input.dataset.key, value);
      });
      // An emptied or junk field snaps back to the last applied value.
      input.addEventListener('blur', () => {
        if (Number.isNaN(parseFloat(input.value))) {
          input.value = input.dataset.last ?? input.defaultValue;
        } else if (input.dataset.last) {
          input.value = input.dataset.last;
        }
      });
    });
    inspectorEl.querySelectorAll('[data-scrub]').forEach((labelEl) => {
      const key = labelEl.dataset.scrub;
      const input = inspectorEl.querySelector(`.numIn[data-key="${key}"]`);
      const spec = specs[input.dataset.spec];
      if (input && spec) {
        attachScrub(labelEl, input, spec, (value) => sendOverride(loc, key, value));
      }
    });
    inspectorEl.querySelectorAll('.fourBtn').forEach((button) => {
      button.addEventListener('click', () => {
        const group = document.getElementById('four-' + button.dataset.four);
        const open = group.style.display !== 'none';
        group.style.display = open ? 'none' : 'grid';
        button.classList.toggle('on', !open);
      });
    });
    inspectorEl.querySelectorAll('.segBtn').forEach((button) => {
      button.addEventListener('click', () => {
        button.parentElement.querySelectorAll('.segBtn').forEach((b) =>
          b.classList.toggle('sel', b === button));
        sendOverride(loc, button.dataset.key, button.dataset.value);
      });
    });
    inspectorEl.querySelectorAll('.chip[data-pop]').forEach((chip) => {
      setupPicker(loc, chip.dataset.pop);
    });
    document.getElementById('saveBtn').addEventListener('click', () => {
      fetch('/__tuner/ui/save', { method: 'POST', body: JSON.stringify({ loc }) }).catch(() => {});
    });
    document.getElementById('undoBtn').addEventListener('click', postUndo);
  }

  function renderTree(nodes, selection, depth, out) {
    for (const node of nodes) {
      const selected = node.loc === selection ? ' selected' : '';
      out.push(
        `<div class="row${selected}" data-loc="${esc(node.loc)}"` +
        ` style="padding-left:${14 + depth * 16}px">` +
        `<span class="name">${displayName(node.name)}</span>` +
        `<span class="loc">${locTail(node.loc)}</span></div>`
      );
      renderTree(node.children, selection, depth + 1, out);
    }
  }

  let lastPayload = '';

  async function poll() {
    try {
      const state = await (await fetch('/__tuner/ui/state')).json();
      const hasTree = Array.isArray(state.tree) && state.tree.length > 0;
      const fresh = hasTree && Date.now() - state.treeAt < 6000;

      statusEl.textContent = fresh ? 'app live' : 'waiting for app';
      statusEl.classList.toggle('live', fresh);

      designOpen = state.designOpen === true;
      modeBtn.textContent = designOpen ? 'Exit design mode' : 'Enter design mode';
      modeBtn.classList.toggle('on', designOpen);

      // Re-render only when something changed — keeps scroll position stable.
      const payload = JSON.stringify([state.tree, state.selection]);
      if (payload !== lastPayload) {
        lastPayload = payload;
        if (hasTree) {
          const out = [];
          renderTree(state.tree, state.selection, 0, out);
          layersEl.innerHTML = out.join('');
          const selected = layersEl.querySelector('.row.selected');
          if (selected) selected.scrollIntoView({ block: 'nearest' });
        } else {
          layersEl.innerHTML = '';
        }
        emptyEl.style.display = hasTree ? 'none' : 'block';
        layersEl.style.display = hasTree ? 'block' : 'none';
      }
      // Inspector rebuilds ONLY on selection change — a poll-time rebuild
      // would yank a field out from under the user's edit.
      if (state.selection !== renderedSelection) {
        renderInspector(state.selection, state.selectionMeta);
      }
    } catch {
      statusEl.textContent = 'dev server unreachable';
      statusEl.classList.remove('live');
    }
    setTimeout(poll, 500);
  }
  poll();
</script>
</body>
</html>
